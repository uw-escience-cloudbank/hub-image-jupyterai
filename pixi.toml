[workspace]
authors = ["Scott Henderson <3924836+scottyhq@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "hub-image-jupyterai"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
install-claude-acp = "npm install -g @agentclientprotocol/claude-agent-acp"
test-litellm = "python test-litellm.py"
patch-jupyterai = "patch -p0 < claude-debug/chat_models_rest_api.py.patch || echo 'Patch may already be applied'"
#start = "jupyter lab --config=jupyter_lab_config.py"
#start = "jupyter lab --no-browser --AiExtension.allowed_providers=openai --AiExtension.initial_language_model=openai/cloudbank-deepseek.r1"
#start = "jupyter lab --config=jupyter_jupyter_ai_config.json"


[dependencies]
python = ">=3.14.6,<3.15"
jupyter-ai = ">=3.1.2,<4"
geopandas = ">=1.1.4,<2"
pip = ">=26.2,<27"
nodejs = ">=26.5.1,<26.6"
jupyterlab = ">=4.6.2,<5"
pyyaml = ">=6.0.3,<7"
# for litellm[proxy]
# litellm = ">=1.91.0,<2"
# backoff = ">=2.2.1,<3"
# fastapi = ">=0.139.0,<0.140"
# apscheduler = ">=3.11.3,<4"
# boto3 = ">=1.43.41,<2"

[pypi-dependencies]
# NOTE: add persistent memory? https://jupyter-ai.readthedocs.io/en/v3/users/jupyternaut/index.html#model-selection
#jupyter-ai-jupyternaut = ">=0.0.11, <0.0.12"
jupyter-ai-jupyternaut = "==0.1.0b0"
langchain = ">=1.3.2, <2"
langchain-core = ">=1.5.3, <2"
