[workspace]
authors = ["Scott Henderson <3924836+scottyhq@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "hub-image-jupyterai"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
install-claude-acp = "npm install -g @agentclientprotocol/claude-agent-acp"
test-litellm = "python test-litellm.py"
start = "bash -c 'set -a; . ./.env; set +a; exec jupyter lab --no-browser --AiExtension.allowed_providers=openai --AiExtension.initial_language_model=openai/claude-haiku-4-5'"
# For <=v3.1
#patch-jupyterai = "patch -p0 < claude-debug/chat_models_rest_api.py.patch || echo 'Patch may already be applied'"
#start = "jupyter lab --config=jupyter_lab_config.py"
#start = "jupyter lab --no-browser --AiExtension.allowed_providers=openai --AiExtension.initial_language_model=openai/cloudbank-deepseek.r1"
#start = "jupyter lab --config=jupyter_jupyter_ai_config.json"
# repo2docker builds one architecture per invocation (--Repo2Docker.platform maps
# 1:1 onto a conda lockfile), so multi-arch = two builds + a manifest list.
repo2docker="repo2docker --Repo2Docker.platform=linux/amd64 --no-run --image-name hub-image-jupyterai:local-amd64 ./"
repo2docker-arm64="repo2docker --Repo2Docker.platform=linux/arm64 --no-run --image-name hub-image-jupyterai:local-arm64 ./"
# repo2docker has no --force flag and skips the build when the target tag already
# exists, so drop the tags to force a rebuild. This leaves the buildx layer cache
# alone, so the rebuild is still incremental.
repo2docker-clean="docker rmi -f hub-image-jupyterai:local-amd64 hub-image-jupyterai:local-arm64 || true"
repo2docker-all={ depends-on=["repo2docker", "repo2docker-arm64"] }


[dependencies]
python = ">=3.14.6,<3.15"
jupyter-ai = ">=3.1.2,<4"
geopandas = ">=1.1.4,<2"
pip = ">=26.2,<27"
nodejs = ">=26.6.0,<26.7"
jupyterlab = ">=4.6.2,<5"
pyyaml = ">=6.0.3,<7"
# for litellm[proxy]
# litellm = ">=1.91.0,<2"
# backoff = ">=2.2.1,<3"
# fastapi = ">=0.139.0,<0.140"
# apscheduler = ">=3.11.3,<4"
# required for jupyternaut apparently
boto3 = ">=1.43.63,<2"
jupyter-repo2docker = ">=2025.12.0,<2026"

[pypi-dependencies]
# NOTE: add persistent memory? https://jupyter-ai.readthedocs.io/en/v3/users/jupyternaut/index.html#model-selection
#jupyter-ai-jupyternaut = ">=0.0.11, <0.0.12"
jupyter-ai-jupyternaut = "==0.1.0b0" # pre-release for jupyter-ai v3.1
langchain = ">=1.3.2, <2"
langchain-core = ">=1.5.3, <2"
